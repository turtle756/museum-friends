<header class="intro"><h1>아이에게 주는 유물 카드</h1>

<main id="list"></main>
<script type="module">
import { loadStops } from "/assets/js/core.js";

const all = [...data.stops, ...(data.extras || [])].filter((s) => s.grid !== false);
document.getElementById("list").innerHTML = page(all);
