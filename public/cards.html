<div class="top"><a href="/">← 부모 앱으로</a><span>임시 시안 페이지 · 학예사 검수 전</span></div>
<header class="intro"><h1>아이에게 주는 유물 카드</h1>
  <p>카드 12장(손에 쥘 만한 실물 유물만). 결정: 5-1(설계도, 깨끗한 뒷면). 예비: 2-1. 앞면은 그림·이름·전투력·스킬 이름만, 이야기는 뒷면. 실제 트레이딩 카드 크기(63×88mm) 비율, 전투력과 스킬 이름은 임시.</p></header>
<main id="list"></main>
<script type="module">
import { loadStops } from "/assets/js/core.js";
import { page } from "/assets/js/cards.js";
const data = await loadStops();
const all = [...data.stops, ...(data.extras || [])].filter((s) => s.grid !== false);
document.getElementById("list").innerHTML = page(all);
</script>
