<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>색·글꼴 고르기 · 부모 카드 시안</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT@2/fonts/variable/woff2/SUIT-Variable.css">
<link rel="stylesheet" href="/assets/css/app.css"><link rel="stylesheet" href="/assets/css/decide.css">
</head>
<body>
<main class="dmain">
  <h1>색과 글꼴</h1>
  <p class="lead">Smartify는 거의 검은 바탕과 흰 글씨만 씁니다. 여기에 우리 색(활 공방 16색)을 포인트로 넣을지, 그대로 갈지 고릅니다. 글꼴은 영어·숫자는 Smartify와 같은 Poppins, 한글만 바꿔 봅니다.</p>
  <h2>색</h2>
  <div class="dtool"><label>보여 줄 화면 <select id="view"><option value="detail">유물 카드</option><option value="home">목록</option></select></label></div>
  <div class="dgrid" id="colors"></div>
  <h2>한글 글꼴</h2>
  <div class="dnote">Noto Sans KR은 가장 흔한 기본 글꼴이라 'AI 티'가 나기 쉽습니다. Pretendard와 SUIT는 요즘 한국 서비스에서 많이 쓰는 글꼴입니다. 모두 무료입니다.</div>
  <div class="dgrid" id="fonts"></div>
</main>
<script type="module">
import { loadStops, esc } from "/assets/js/core.js";
import { home, detail, wire, wireQuiz } from "/assets/js/app.js";
import { shell, phone } from "/assets/js/shell.js";
shell();
const { stops } = await loadStops();
const s = stops.find((x) => x.id === "singijeon");
const li = (a, c) => `<ul class="${c}">${a.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;
const vars = (o) => Object.entries(o).map(([k, v]) => `--${k}:${v}`).join(";");
const COLORS = [
  ["K1", "Smartify 그대로", {}, "검은 바탕, 흰 글씨, 강조도 흰색. 색은 사진에서만 나온다.", ["사진이 가장 돋보인다", "고를 게 없어 흔들리지 않는다"], ["박물관만의 색이 없다"], true],
  ["K2", "황금 포인트", { accent: "#E3A238", "on-accent": "#24160F", ask: "#F3D17E" }, "질문 글씨와 버튼만 활 공방 황금색.", ["따뜻하고 활 재료(물소뿔·나무) 느낌", "강조가 한눈에 보인다"], ["노란색이 많아지면 촌스러울 수 있다"]],
  ["K3", "주홍 포인트", { accent: "#DB5F35", "on-accent": "#FFFAF0", ask: "#F0A07E" }, "질문과 버튼만 주홍. 로고의 붉은 네모와 이어진다.", ["박물관 로고 색과 맞는다"], ["빨강 계열은 경고처럼 보일 수 있다"]],
  ["K4", "밝은 판(한지)", { bg: "#FFFAF0", surface: "#F1E4CA", "surface-2": "#F1E4CA", line: "#DDB984", text: "#24160F", sub: "#5E3621", accent: "#24160F", "on-accent": "#FFFAF0", ask: "#7E1C17" }, "구조는 그대로, 바탕만 밝은 한지색.", ["밝은 전시실에서 읽기 편하다"], ["Smartify 느낌이 약해진다"]],
];
const FONTS = [
  ["F1", "Pretendard", '"Poppins", "Pretendard Variable", sans-serif', "요즘 한국 서비스에서 가장 많이 쓰는 글꼴. 반듯하고 읽기 쉽다.", ["작은 글씨도 또렷하다"], ["너무 흔해서 개성은 약하다"], true],
  ["F2", "SUIT", '"Poppins", "SUIT Variable", sans-serif', "Pretendard보다 조금 더 둥글고 단단한 느낌.", ["Poppins와 모양이 비슷해 잘 섞인다"], ["Pretendard와 차이가 크지 않다"]],
  ["F3", "Noto Sans KR", '"Poppins", "Noto Sans KR", sans-serif', "구글 기본 한글 글꼴.", ["어디서나 같은 모양"], ["가장 흔한 기본값(AI 티)"]],
];
const box = (id, name, o, idea, plus, minus, now, inner) => `<section class="ditem">
  <div class="ditem__name"><span>${id}</span>${esc(name)} ${now ? '<b class="now">지금</b>' : ""}</div><div class="ditem__idea">${esc(idea)}</div>
  ${phone(id, inner, vars(o))}${li(plus, "plus")}${li(minus, "minus")}</section>`;
function draw() {
  const v = document.getElementById("view").value;
  const inner = v === "home" ? home(stops) : detail(s, { noBack: true });
  document.getElementById("colors").innerHTML = COLORS.map(([id, name, o, idea, p, m, now]) => box(id, name, o, idea, p, m, now, inner)).join("");
}
document.getElementById("fonts").innerHTML = FONTS.map(([id, name, f, idea, p, m, now]) => box(id, name, { font: f }, idea, p, m, now, detail(s, { noBack: true }))).join("");
document.getElementById("view").onchange = draw;
document.addEventListener("click", (e) => { if (e.target.closest(".tile")) e.preventDefault(); });
wire(document.body);
wireQuiz(document.body, (id) => stops.find((x) => x.id === id));
draw();
</script>
</body>
</html>
