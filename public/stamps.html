<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>도장 방식 · 유물 친구 시안 갤러리</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/assets/css/g.css">
</head>
<body>
<main class="gmain">
  <h1>도장 방식 6안</h1>
  <p class="lead">교수님 피드백: 아이 손에 뭔가를 쥐여 주고, 퀴즈와 도장으로 성취감을 줘야 합니다. 문제는 <b>직원이 없다</b>는 것. 직원 없이 보상을 주는 방법을 모았습니다.</p>
  <div class="note">여러 개를 섞어도 됩니다. 예: 정류장에서는 부모 확인 칸(M4), 마지막에만 안내데스크 도장(M2).</div>
  <div id="list" class="grid grid--2"></div>
</main>
<script type="module">
import { chrome, esc, icon } from "/assets/js/core.js";
import { STAMPS } from "/assets/js/options.js";
chrome();
const li = (a, cls) => `<ul class="pc ${cls} small">${a.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;
document.getElementById("list").innerHTML = STAMPS.map((M) => `<article class="box stampcard" id="${M.id}">
  <div>${icon(M.icon, 64)}</div>
  <div>
    <div><span class="chip chip--red">${M.id}</span></div>
    <h2 style="margin:.3em 0">${esc(M.name)}</h2>
    <p style="margin:0">${esc(M.how)}</p>
    <dl class="kv"><dt>준비물</dt><dd>${esc(M.need)}</dd><dt>비용</dt><dd>${esc(M.cost)}</dd><dt>직원</dt><dd>${esc(M.staff)}</dd></dl>
    ${li(M.pros, "pros")}${li(M.cons, "cons")}
  </div></article>`).join("");
if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
</script>
</body>
</html>
