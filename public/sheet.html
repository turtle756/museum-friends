<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>활동지 인쇄 · 유물 친구 시안 갤러리</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Song+Myung&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/sheet.css">
<style>
.ptool { position: sticky; top: 0; z-index: 5; background: #24160F; color: #FFFAF0; padding: 10px 16px; display: flex; gap: 12px; align-items: center; font-size: 15px; }
.ptool a, .ptool button { color: #24160F; background: #E3A238; border: 3px solid #FFFAF0; padding: 4px 12px; font-weight: 800; text-decoration: none; cursor: pointer; font: inherit; }
</style>
</head>
<body class="sheet-body">
<div class="ptool noprint" id="tool"><a href="/sheets.html">목록으로</a><b id="nm"></b><button onclick="print()">인쇄 / PDF로 저장</button><span>인쇄 설정: 여백 없음, 배율 100%</span></div>
<div id="out"></div>
<script type="module">
import { loadStops } from "/assets/js/core.js";
import { SHEETS, renderSheet } from "/assets/js/sheets.js";
import { ROUTES } from "/assets/js/options.js";
const p = new URLSearchParams(location.search);
const id = p.get("v") || "S1";
if (p.get("embed")) { document.body.classList.add("embed"); document.getElementById("tool").remove(); }
const S = SHEETS.find((x) => x.id === id) || SHEETS[0];
document.title = `${S.id} ${S.name} · 활동지 시안`;
const nm = document.getElementById("nm"); if (nm) nm.textContent = `${S.id} ${S.name}`;
let { stops } = await loadStops();
const route = ROUTES.find((r) => r.id === p.get("r"));
if (route) stops = route.stops.map((id, i) => ({ ...stops.find((s) => s.id === id), no: i + 1 }));
document.getElementById("out").innerHTML = renderSheet(S.id, stops);
</script>
</body>
</html>
