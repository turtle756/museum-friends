<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>동선 · 유물 친구 시안 갤러리</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/assets/css/g.css">
</head>
<body>
<main class="gmain">
  <h1>동선 3안</h1>
  <p class="lead">몇 곳을 어떤 순서로 도는지입니다. 약도는 관람 안내 지도를 옮겨 그린 추정도이고, 주황 점선이 박물관이 안내하는 관람 순서입니다.</p>
  <div class="note warn"><b>걸리는 시간은 아직 모릅니다.</b> 팀이 현장에서 아이 걸음으로 돌아 보며 재야 합니다. R1과 R2는 시간을 잰 뒤에 고르는 것이 안전합니다.</div>
  <div id="list" class="grid" style="gap:28px"></div>
</main>
<script type="module">
import { chrome, esc, loadStops, museumMap } from "/assets/js/core.js";
import { ROUTES } from "/assets/js/options.js";
chrome();
const { stops } = await loadStops();
const li = (a, cls) => `<ul class="pc ${cls} small">${a.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;
document.getElementById("list").innerHTML = ROUTES.map((R) => {
  const st = R.stops.map((id) => stops.find((s) => s.id === id));
  return `<article class="box" id="${R.id}">
    <div><span class="chip chip--red">${R.id}</span> <span class="chip">${st.length}곳</span></div>
    <h2 style="margin:.3em 0">${esc(R.name)}</h2>
    <p style="margin:0 0 10px">${esc(R.idea)}</p>
    <div class="routemap">${museumMap({ stops: st, showRoute: !R.free, numbered: !R.free })}</div>
    <ol class="stoplist">${st.map((s, i) => `<li><b>${R.free ? "" : i + 1}</b>${esc(s.name)}</li>`).join("")}</ol>
    <div class="split">${li(R.pros, "pros")}${li(R.cons, "cons")}</div>
  </article>`;
}).join("");
if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
</script>
</body>
</html>
