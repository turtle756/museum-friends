<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>흐름 체험 · 유물 친구 시안 갤러리</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Song+Myung&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/g.css">
</head>
<body>
<main class="gmain">
  <h1>흐름 체험</h1>
  <p class="lead">입구에서 QR을 찍은 부모의 휴대폰 화면을 처음부터 끝까지 눌러 봅니다. 오른쪽은 같은 시간 아이 손에 있는 종이입니다.</p>
  <div class="toolbar">
    <label>큰 전략 <select id="s"></select></label>
    <label>부모 카드 <select id="c"></select></label>
    <label>그림 <select id="t"><option value="pixel">사진 기반 픽셀</option><option value="trad">전통 느낌</option><option value="mix">혼합</option></select></label>
  </div>
  <div class="proto">
    <div>
      <div class="phone">
        <div class="phone__bar"><span>부모 휴대폰</span><span id="pos"></span></div>
        <div class="phone__screen" id="screen"></div>
        <div class="flow__nav" id="nav"></div>
      </div>
      <p class="small muted" style="max-width:360px">새로고침해도 보던 카드에서 이어집니다. 실제로는 정류장마다 QR을 붙여 그 카드가 바로 열리게 할 수도 있습니다.</p>
    </div>
    <div class="kidside">
      <h2 style="margin-top:0">같은 시간, 아이 손에는</h2>
      <p id="kid" style="margin-top:0"></p>
      <div id="sheet"></div>
      <h3 style="margin-top:20px">하루 흐름</h3>
      <ol class="journey" id="journey"></ol>
    </div>
  </div>
</main>
<script type="module">
import { chrome, esc, icon, loadStops } from "/assets/js/core.js";
import { STRATEGIES, STAMPS, THEMES, ROUTES } from "/assets/js/options.js";
import { CARD_LAYOUTS, renderCard, wireCards } from "/assets/js/cards.js";
import { SHEETS } from "/assets/js/sheets.js";
chrome();
const { stops: ALL } = await loadStops();
const $ = (id) => document.getElementById(id);
const p = new URLSearchParams(location.search);
$("s").innerHTML = STRATEGIES.map((x) => `<option value="${x.id}">${x.id}. ${esc(x.name)}</option>`).join("");
$("c").innerHTML = CARD_LAYOUTS.map((x) => `<option value="${x.id}">${x.id} ${esc(x.name)}</option>`).join("");
const startS = STRATEGIES.find((x) => x.id === p.get("s")) || STRATEGIES.find((x) => x.id === "C");
$("s").value = startS.id;
$("c").value = CARD_LAYOUTS.some((x) => x.id === p.get("c")) ? p.get("c") : startS.combo.card;
if (["pixel", "trad", "mix"].includes(p.get("t"))) $("t").value = p.get("t");

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* 저장 못 해도 화면은 동작 */ } },
};
let S, stops, idx = 0;
const key = () => `mf-proto-${S.id}-${$("c").value}`;

function setup(keepStop) {
  S = STRATEGIES.find((x) => x.id === $("s").value);
  const route = ROUTES.find((r) => r.id === S.combo.route);
  stops = route.stops.map((id) => ALL.find((s) => s.id === id));
  const saved = parseInt(store.get(key()) ?? "0", 10);
  idx = Number.isFinite(saved) && saved >= 0 && saved <= stops.length + 1 ? saved : 0;
  if (keepStop) {
    const at = stops.findIndex((s) => s.id === keepStop);
    if (at >= 0) idx = at + 1;
  }
  const q = new URLSearchParams({ s: S.id, c: $("c").value, t: $("t").value });
  history.replaceState(null, "", `?${q}`);
  drawKid();
  draw();
}

function drawKid() {
  $("kid").textContent = S.kid;
  $("journey").innerHTML = S.journey.map((j) => `<li>${esc(j)}</li>`).join("");
  const sh = SHEETS.find((x) => x.id === S.combo.sheet);
  if (!sh) {
    $("sheet").innerHTML = `<div class="box box--flat" style="max-width:420px">${icon("fold", 48)}<p style="margin:6px 0 0">박물관이 이미 쓰는 「부천활탐험대」 활동지를 그대로 씁니다. 실물 사진을 받으면 여기에 넣습니다.</p></div>`;
    return;
  }
  const land = sh.orientation === "landscape";
  const url = `/sheet.html?v=${sh.id}&r=${S.combo.route}`;
  $("sheet").innerHTML = `<a class="sheetprev${land ? " sheetprev--land" : ""}" href="${url}" title="인쇄용 열기"><iframe src="${url}&embed=1" scrolling="no" tabindex="-1" title="${esc(sh.name)} 미리보기"></iframe></a>
    <p class="small"><a href="${url}">${sh.id} ${esc(sh.name)} 인쇄용 열기 (이 동선에 맞춘 판)</a></p>`;
  fitSheet();
}
function fitSheet() {
  const box = document.querySelector(".kidside .sheetprev");
  if (!box) return;
  const land = box.classList.contains("sheetprev--land");
  const w = land ? 1123 : 794, h = land ? 794 : 1123;
  const fr = box.querySelector("iframe");
  fr.style.width = `${w}px`; fr.style.height = `${h}px`;
  fr.style.transform = `scale(${box.clientWidth / w})`;
}
addEventListener("resize", fitSheet);

function draw() {
  const n = stops.length, theme = $("t").value, card = $("c").value;
  const T = THEMES.find((x) => x.id === S.combo.theme), M = STAMPS.find((x) => x.id === S.combo.stamp);
  const bar = `<div class="flow__bar">${stops.map((_, i) => `<span class="${i < idx ? "on" : ""}"></span>`).join("")}</div>`;
  let html;
  if (idx === 0) {
    $("pos").textContent = "시작";
    html = `<div class="flow">
      <div class="small" style="font-weight:800;color:var(--godong)">부천활박물관 · 부모 카드</div>
      <div class="flow__title">오늘은 엄마 아빠가<br>큐레이터예요</div>
      <ol class="steps-ol small">
        <li><div>번호를 따라 정류장 ${n}곳을 돌아요.</div></li>
        <li><div>카드를 잠깐 보고, 아이에게 말로 들려주세요.</div></li>
        <li><div>휴대폰은 엄마 아빠만 봐요. 아이는 종이를 들고 다녀요.</div></li>
      </ol>
      <div class="small" style="font-weight:800">첫마디로 이렇게 말해 주세요</div>
      <div class="say">${esc(T.opening)}</div></div>`;
  } else if (idx <= n) {
    const s = stops[idx - 1];
    $("pos").textContent = `${idx} / ${n}`;
    html = `<div style="padding:12px 16px 0">${bar}</div>${renderCard(card, { ...s, no: idx }, { total: n, theme, stops })}`;
  } else {
    $("pos").textContent = "끝";
    html = `<div class="flow">${bar}<div class="flow__done">${icon("star", 96)}
      <div class="flow__title">${n}곳을 모두 돌았어요!</div>
      <div class="box box--flat" style="text-align:left"><b>마무리</b><br>${esc(T.ending)}</div>
      <div class="box box--flat" style="text-align:left"><b>도장</b><br>${esc(M.how)}</div>
      <p class="small muted">안내데스크로 가면 끝입니다. 오늘 들려준 이야기 중 아이가 하나라도 다시 말하면 성공이에요.</p></div></div>`;
  }
  $("screen").innerHTML = html;
  $("screen").scrollTop = 0;
  const prev = idx > 0 ? `<button class="btn btn--paper" data-go="-1">이전</button>` : "";
  const next = idx === 0 ? `<button class="btn" data-go="1">시작하기</button>`
    : idx <= n ? `<button class="btn" data-go="1">${idx === n ? "마무리" : "다음 정류장"}</button>`
    : `<button class="btn btn--gold" data-go="reset">처음으로</button>`;
  $("nav").innerHTML = prev + next;
  store.set(key(), String(idx));
}
$("nav").addEventListener("click", (e) => {
  const b = e.target.closest("[data-go]");
  if (!b) return;
  idx = b.dataset.go === "reset" ? 0 : Math.max(0, Math.min(stops.length + 1, idx + Number(b.dataset.go)));
  draw();
});
wireCards($("screen"));
$("s").onchange = () => { $("c").value = STRATEGIES.find((x) => x.id === $("s").value).combo.card; setup(); };
$("c").onchange = $("t").onchange = () => setup(idx > 0 && idx <= stops.length ? stops[idx - 1].id : null);
setup(p.get("stop"));
</script>
</body>
</html>
