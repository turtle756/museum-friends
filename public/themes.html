<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>이야기 틀 · 유물 친구 시안 갤러리</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/assets/css/g.css">
</head>
<body>
<main class="gmain">
  <h1>이야기 틀 4안</h1>
  <p class="lead">아이가 오늘 맡을 역할입니다. 같은 8곳을 돌아도 역할이 있으면 "다음은 뭐야?"가 나옵니다. 부모는 첫 정류장에서 노란 말풍선 한 줄만 읽어 주면 됩니다.</p>
  <div class="note">학예사 강연에서 추천한 테마와 이어집니다: <b>활쏘기 문화·무과 시험 과목</b>(T1), <b>활 장인과 만드는 기술</b>(T2), <b>활의 쓰임이 사냥 → 전쟁 → 마음 수련으로 바뀐 이야기</b>(T3), <b>신기전기화차 같은 화약 무기</b>(T4).</div>
  <div id="list" class="grid grid--2"></div>
</main>
<script type="module">
import { chrome, esc, loadStops } from "/assets/js/core.js";
import { THEMES } from "/assets/js/options.js";
chrome();
const { stops } = await loadStops();
const stopName = (id) => (stops.find((s) => s.id === id) || {}).name || id;
const li = (a, cls) => `<ul class="pc ${cls} small">${a.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;
document.getElementById("list").innerHTML = THEMES.map((T) => `<article class="box" id="${T.id}">
  <div><span class="chip chip--red">${T.id}</span></div>
  <h2 style="margin:.3em 0">${esc(T.name)}</h2>
  <p class="muted" style="margin:0">${esc(T.role)}</p>
  <div class="small" style="margin-top:10px;font-weight:800">첫 정류장에서 부모가 읽어 주는 말</div>
  <div class="say">${esc(T.opening)}</div>
  <div class="small" style="font-weight:800">이야기가 걸리는 정류장</div>
  <ul class="links">${T.links.map(([id, d]) => `<li><span class="chip chip--line">${esc(stopName(id))}</span><span>${esc(d)}</span></li>`).join("")}</ul>
  <p style="margin:6px 0"><b>끝:</b> ${esc(T.ending)}</p>
  <p class="small muted" style="margin:0 0 8px">어울리는 조합: ${esc(T.fit)}</p>
  ${li(T.pros, "pros")}${li(T.cons, "cons")}
</article>`).join("");
if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
</script>
</body>
</html>
