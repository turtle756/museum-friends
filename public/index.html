<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1b1b1b">
<title>부천활박물관 부모 카드 · 시안</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/assets/css/app.css">
<script>try { if (localStorage.getItem("mf-theme") === "light") document.documentElement.dataset.theme = "light"; } catch (e) {}</script>
</head>
<body>
<div class="devstrip"><span>시안 · 학예사 검수 전</span></div>
<main class="app" id="app" aria-live="polite"></main>
<script type="module">
import { loadStops } from "/assets/js/core.js";
import { home, detail, settle, wireQuiz, loadSeen, markSeen, clearSeen, getTheme, setTheme } from "/assets/js/app.js";
const data = await loadStops();
const items = [...data.stops, ...(data.extras || [])].filter((s) => s.grid !== false);   // 처음 8곳 + 추가 유물(나눠진 칸은 뺌)
const root = document.getElementById("app");
const opts = {};
const calm = matchMedia("(prefers-reduced-motion: reduce)");
let homeScroll = 0, lastId = null, fresh = null;
function render(s) {
  if (s) {
    fresh = loadSeen().has(s.id) ? null : s.id;   // 처음 본 유물이면 격자로 돌아갈 때 체크 표시가 톡 나타난다
    lastId = s.id;
    markSeen(s.id);
    root.innerHTML = detail(s, opts);
    document.title = `${s.name} · 부천활박물관 부모 카드`;
    window.scrollTo(0, 0);
  } else {
    root.innerHTML = home(items, { ...opts, seen: loadSeen(), theme: getTheme(), fresh });
    fresh = null;
    document.title = "부천활박물관 부모 카드 · 시안";
    window.scrollTo(0, homeScroll);
  }
  settle(root);
}
// 격자 사진이 카드 사진으로 커지며 이어지고, 돌아갈 때 제자리로 줄어든다 (지원하지 않는 브라우저는 바로 바뀜)
function route() {
  const m = location.hash.match(/^#\/a\/([\w-]+)/);
  const s = m && items.find((x) => x.id === m[1]);
  const onDetail = !!root.querySelector(".detail");
  if (s && !onDetail) homeScroll = window.scrollY;
  let from = s ? root.querySelector(`.tile[data-id="${s.id}"] img`) : root.querySelector(".detail .hero");
  if (from && from.getBoundingClientRect().bottom < 0) from = null;   // 화면 밖으로 올라간 사진은 잇지 않는다
  if (!document.startViewTransition || calm.matches || (!onDetail && !s) || (onDetail && s)) { render(s); return; }
  const backId = lastId;
  if (from) from.style.viewTransitionName = "art";
  const t = document.startViewTransition(() => {
    render(s);
    const to = s ? root.querySelector(".hero") : root.querySelector(`.tile[data-id="${backId}"] img`);
    if (from && to) to.style.viewTransitionName = "art";
  });
  t.finished.finally(() => root.querySelectorAll(".hero, .tile img").forEach((e) => { e.style.viewTransitionName = ""; }));
}
root.addEventListener("click", (e) => {
  if (e.target.closest("[data-theme-toggle]")) { homeScroll = window.scrollY; setTheme(getTheme() === "light" ? "dark" : "light"); route(); }
  else if (e.target.closest("[data-clear-seen]")) { homeScroll = window.scrollY; clearSeen(); route(); }
});
addEventListener("hashchange", route);
wireQuiz(root, (id) => items.find((x) => x.id === id));
route();
</script>
</body>
</html>
